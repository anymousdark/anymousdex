name: Build Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Install app dependencies
        working-directory: src
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Install prebuilt node-pty (Electron 12, win32-x64)
        shell: pwsh
        run: |
          $dest = "src/node_modules/node-pty/build/Release"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "vendor/node-pty/win32-x64/*" $dest -Force
          Get-ChildItem $dest | Select-Object Name, Length

      - name: Build installer
        run: npx electron-builder build -w --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnymousDEX-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
