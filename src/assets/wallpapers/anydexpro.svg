<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#070a10"/>
            <stop offset="0.42" stop-color="#0d1420"/>
            <stop offset="0.72" stop-color="#152034"/>
            <stop offset="1" stop-color="#090d14"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.63" cy="0.3" r="0.68">
            <stop offset="0" stop-color="#88c0d0" stop-opacity="0.20"/>
            <stop offset="0.45" stop-color="#5e81ac" stop-opacity="0.08"/>
            <stop offset="1" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glow2" cx="0.22" cy="0.72" r="0.55">
            <stop offset="0" stop-color="#b48ead" stop-opacity="0.10"/>
            <stop offset="1" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="auroraA" x1="0" y1="0" x2="1" y2="0.25">
            <stop offset="0" stop-color="#88c0d0" stop-opacity="0"/>
            <stop offset="0.28" stop-color="#8fbcbb" stop-opacity="0.55"/>
            <stop offset="0.58" stop-color="#88c0d0" stop-opacity="0.32"/>
            <stop offset="1" stop-color="#81a1c1" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="auroraB" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#b48ead" stop-opacity="0"/>
            <stop offset="0.5" stop-color="#b48ead" stop-opacity="0.26"/>
            <stop offset="1" stop-color="#88c0d0" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="ridgeBack" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#223149"/>
            <stop offset="1" stop-color="#0e1521"/>
        </linearGradient>
        <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1a2638"/>
            <stop offset="1" stop-color="#0a0f18"/>
        </linearGradient>
        <linearGradient id="ridgeFront" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#111a29"/>
            <stop offset="1" stop-color="#06090f"/>
        </linearGradient>
        <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#88c0d0" stop-opacity="0"/>
            <stop offset="0.42" stop-color="#88c0d0" stop-opacity="0.32"/>
            <stop offset="0.62" stop-color="#b48ead" stop-opacity="0.18"/>
            <stop offset="1" stop-color="#88c0d0" stop-opacity="0"/>
        </linearGradient>
        <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
            <path d="M 96 0 L 0 0 0 96" fill="none" stroke="#88c0d0" stroke-opacity="0.045" stroke-width="1"/>
        </pattern>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="42"/>
        </filter>
        <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="18"/>
        </filter>
        <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.78">
            <stop offset="0.52" stop-color="#000000" stop-opacity="0"/>
            <stop offset="0.82" stop-color="#000000" stop-opacity="0.22"/>
            <stop offset="1" stop-color="#000000" stop-opacity="0.66"/>
        </radialGradient>
    </defs>

    <rect width="1920" height="1080" fill="url(#sky)"/>
    <rect width="1920" height="1080" fill="url(#glow)"/>
    <rect width="1920" height="1080" fill="url(#glow2)"/>

    <g filter="url(#soft)" opacity="0.9">
        <path d="M -140 322 C 250 150, 560 420, 880 268 S 1460 148, 1780 330 S 2020 300, 2100 260"
              fill="none" stroke="url(#auroraA)" stroke-width="112" stroke-linecap="round"/>
        <path d="M -120 438 C 320 300, 620 570, 980 394 S 1560 260, 1980 452"
              fill="none" stroke="url(#auroraB)" stroke-width="74" stroke-linecap="round"/>
        <path d="M 120 208 C 520 66, 900 330, 1280 196 S 1780 128, 2040 240"
              fill="none" stroke="url(#auroraA)" stroke-width="54" stroke-linecap="round" opacity="0.55"/>
    </g>

    <g fill="#e5e9f0">
        <circle cx="164" cy="144" r="1.6" opacity="0.55"/>
        <circle cx="312" cy="248" r="1.1" opacity="0.4"/>
        <circle cx="498" cy="118" r="1.3" opacity="0.5"/>
        <circle cx="742" cy="202" r="1" opacity="0.35"/>
        <circle cx="936" cy="96" r="1.7" opacity="0.6"/>
        <circle cx="1128" cy="182" r="1.1" opacity="0.4"/>
        <circle cx="1306" cy="118" r="1.4" opacity="0.5"/>
        <circle cx="1512" cy="236" r="1" opacity="0.34"/>
        <circle cx="1688" cy="126" r="1.6" opacity="0.58"/>
        <circle cx="1842" cy="210" r="1.2" opacity="0.42"/>
        <circle cx="82" cy="352" r="1" opacity="0.3"/>
        <circle cx="406" cy="392" r="1.2" opacity="0.36"/>
        <circle cx="1218" cy="336" r="1" opacity="0.3"/>
        <circle cx="1928" cy="356" r="1.2" opacity="0.36"/>
    </g>

    <rect width="1920" height="1080" fill="url(#grid)" opacity="0.7"/>
    <rect x="0" y="632" width="1920" height="3" fill="url(#horizon)" opacity="0.75"/>

    <g filter="url(#soft2)" opacity="0.5">
        <ellipse cx="960" cy="694" rx="620" ry="46" fill="#88c0d0" opacity="0.14"/>
    </g>

    <path d="M 0 742 L 132 668 L 262 718 L 398 628 L 534 726 L 690 646 L 822 730 L 962 662 L 1104 748 L 1246 676 L 1388 756 L 1548 690 L 1690 748 L 1832 682 L 1920 726 L 1920 1080 L 0 1080 Z"
          fill="url(#ridgeBack)" opacity="0.9"/>
    <path d="M 0 806 L 168 724 L 304 796 L 462 706 L 622 804 L 782 728 L 928 812 L 1082 736 L 1240 820 L 1410 748 L 1570 830 L 1730 760 L 1888 826 L 1920 810 L 1920 1080 L 0 1080 Z"
          fill="url(#ridgeMid)" opacity="0.94"/>
    <path d="M 0 892 L 204 800 L 380 884 L 548 796 L 720 896 L 894 812 L 1060 904 L 1242 820 L 1420 910 L 1602 828 L 1786 918 L 1920 858 L 1920 1080 L 0 1080 Z"
          fill="url(#ridgeFront)"/>

    <g opacity="0.42">
        <path d="M 0 896 L 204 804 L 380 888 L 548 800 L 720 900 L 894 816 L 1060 908 L 1242 824 L 1420 914 L 1602 832 L 1786 922 L 1920 862"
              fill="none" stroke="#88c0d0" stroke-opacity="0.32" stroke-width="1.6"/>
    </g>

    <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
